name: CI/CD TerreMerGn

on:
  push:
    branches: [pre-prod, main]
  pull_request:
    branches: [pre-prod, main]

permissions:
  contents: read

jobs:
  backend:
    name: Vérifier le backend
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier Django
        run: python manage.py check

      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Vérifier le frontend
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construire le frontend
        working-directory: frontend
        run: npm ci && npm run build

  images:
    name: Construire les images Docker
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image backend
        run: docker build -f Dockerfile.backend -t terremergn-backend:${{ github.sha }} .

      - name: Construire l'image frontend
        run: docker build -f frontend/Dockerfile -t terremergn-frontend:${{ github.sha }} frontend

  # Étape de déploiement à relier au fournisseur choisi avec des secrets protégés.
  deploy-pre-prod:
    name: Déployer pre-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/pre-prod'
    needs: images
    runs-on: ubuntu-latest
    environment: pre-prod
    steps:
      - name: Déclencher le déploiement Render
        if: ${{ secrets.RENDER_PREPROD_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_PREPROD_DEPLOY_HOOK }}"

      - name: Signaler la configuration manquante
        if: ${{ secrets.RENDER_PREPROD_DEPLOY_HOOK == '' }}
        run: echo "Aucun hook Render configuré; ajoutez RENDER_PREPROD_DEPLOY_HOOK dans l'environnement pre-prod."
